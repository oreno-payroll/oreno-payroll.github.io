name: Deploy Payroll to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '19 0 * * 1'

permissions:
  contents: read

concurrency:
  group: payroll-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout complete Git history for secret audits
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify PR merge checkout and include it in Git history audits
        run: node scripts/audit-pr-target.mjs

      - name: Audit published source and check PDF viewer files
        run: node scripts/audit-publish.mjs

      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --show-error --silent --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          chmod 755 "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      - name: Supplemental private-data audit (tracked files and Git author history)
        run: node scripts/audit-private-data.mjs --strict-gitleaks --skip-current-author --require-private-terms
        env:
          PAYROLL_PRIVATE_TERMS_B64: ${{ secrets.PAYROLL_PRIVATE_TERMS_B64 }}

      - name: Full Git history Gitleaks audit (deployment gate)
        run: gitleaks git --log-opts=--all --redact --no-banner .

      - name: Verify audited MSAL npm lockfile and redirect bridge source
        run: node scripts/audit-msal.mjs

      - name: Audit workflow security shape
        run: node scripts/audit-ci-workflow.mjs

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Build Payroll
        run: npm run build

      - name: Verify generated MSAL bundle and redirect bridge
        run: node scripts/audit-msal.mjs --built

      - name: Audit complete Pages distribution
        run: node scripts/audit-dist.mjs --require-private-terms
        env:
          PAYROLL_PRIVATE_TERMS_B64: ${{ secrets.PAYROLL_PRIVATE_TERMS_B64 }}

      - name: Regression tests
        run: npm test

      - name: Upload exactly the audited Pages build
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: security
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
