name: Deploy Payroll to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '19 0 * * 1'

permissions:
  contents: read

concurrency:
  group: payroll-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      encrypted_id: ${{ steps.sealed_upload.outputs.artifact-id }}
      encrypted_sha256: ${{ steps.seal.outputs.sha256 }}
    steps:
      - name: Checkout complete Git history for secret audits
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify PR merge checkout and include it in Git history audits
        run: node scripts/audit-pr-target.mjs

      - name: Audit published source and check PDF viewer files
        run: node scripts/audit-publish.mjs

      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --show-error --silent --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          chmod 755 "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      - name: Supplemental private-data audit (no private dictionary on PR runners)
        run: node scripts/audit-private-data.mjs --no-gitleaks --skip-current-author

      - name: Full Git history Gitleaks audit (deployment gate)
        run: gitleaks git --log-opts=--all --redact --no-banner .

      - name: Verify audited MSAL npm lockfile and redirect bridge source
        run: node scripts/audit-msal.mjs

      - name: Audit workflow security shape
        run: node scripts/audit-ci-workflow.mjs

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Build Payroll
        run: npm run build

      - name: Verify generated MSAL bundle and redirect bridge
        run: node scripts/audit-msal.mjs --built

      - name: Audit complete Pages distribution
        run: node scripts/audit-dist.mjs

      - name: Regression tests
        run: npm test

      - name: Install Playwright Chromium for headless E2E
        run: npx playwright install --with-deps chromium

      - name: Headless Chromium end-to-end regression tests
        run: npm run test:e2e

      - name: Re-audit Pages distribution immediately before artifact upload
        run: node scripts/audit-dist.mjs

      - name: Seal exact build for isolated main audit (never upload plaintext here)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        id: seal
        shell: bash
        env:
          PAYROLL_AUDIT_CERT_B64: ${{ vars.PAYROLL_AUDIT_CERT_B64 }}
        run: |
          set -euo pipefail
          python3 scripts/audit-private-artifact.py seal dist "$RUNNER_TEMP/payroll-build.cms"
          digest="$(sha256sum "$RUNNER_TEMP/payroll-build.cms" | cut -d ' ' -f 1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted intermediate only
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        id: sealed_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: payroll-encrypted-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/payroll-build.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  private_audit:
    name: private-audit
    needs: security
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    # This environment MUST have a selected deployment branch of exactly main.
    environment: payroll-private-audit
    permissions:
      contents: read
    steps:
      - name: Checkout only the reviewed main commit on a fresh runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js without dependency cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Confirm main checkout and reviewed workflow
        run: |
          node scripts/audit-pr-target.mjs
          node scripts/audit-ci-workflow.mjs

      - name: Audit main source and complete history with private dictionary
        run: node scripts/audit-private-data.mjs --no-gitleaks --skip-current-author --require-private-terms
        env:
          PAYROLL_PRIVATE_TERMS_B64: ${{ secrets.PAYROLL_PRIVATE_TERMS_B64 }}

      - name: Require exact encrypted artifact identity
        env:
          ARTIFACT_ID: ${{ needs.security.outputs.encrypted_id }}
          ARTIFACT_SHA256: ${{ needs.security.outputs.encrypted_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_SHA256" =~ ^[a-f0-9]{64}$ ]]

      - name: Download exact encrypted build outside checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.security.outputs.encrypted_id }}
          path: ${{ runner.temp }}/payroll-encrypted
          merge-multiple: true

      - name: Authenticate decrypt and privately audit the exact build as data
        shell: bash
        env:
          PAYROLL_PRIVATE_TERMS_B64: ${{ secrets.PAYROLL_PRIVATE_TERMS_B64 }}
          PAYROLL_AUDIT_ARTIFACT_KEY_B64: ${{ secrets.PAYROLL_AUDIT_ARTIFACT_KEY_B64 }}
          ARTIFACT_SHA256: ${{ needs.security.outputs.encrypted_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/audit-private-artifact.py audit-open "$RUNNER_TEMP/payroll-encrypted/payroll-build.cms" "$RUNNER_TEMP/payroll-audited-pages" "$ARTIFACT_SHA256"

      - name: Upload exactly the audited Pages build
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/payroll-audited-pages

  deploy:
    needs: [security, private_audit]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
