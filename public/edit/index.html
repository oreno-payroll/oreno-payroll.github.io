<!doctype html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content"><meta name="referrer" content="no-referrer">

  <script src="../frame-guard.js"></script>
<script src="../theme.js"></script><title>保存済み明細の編集 | Payroll</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png"><link rel="stylesheet" href="../styles/ress.css"><link rel="stylesheet" href="../styles/style.css"><link rel="stylesheet" href="../styles/upload.css"><link rel="stylesheet" href="../styles/vault.css"><script type="module" src="../edit.js"></script>
  <link rel="stylesheet" href="../styles/cloud.css"><link rel="stylesheet" href="../styles/theme.css"></head><body class="payroll-edit-viewport">
<svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="icon-ledger" viewBox="0 0 24 24"><rect x="5" y="3" width="15" height="18" rx="2"/><path d="M9 3v18M12 8h5M12 12h5M12 16h4"/></symbol>
<symbol id="icon-arrow" viewBox="0 0 24 24"><path d="m14 7-5 5 5 5"/></symbol>
<symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5"/><path d="M4 17v3h16v-3"/></symbol>
<symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></symbol>
<symbol id="icon-file" viewBox="0 0 24 24"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10z"/><path d="M13 3v7h7M8 15h8"/></symbol>
<symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6-9 9"/><path d="M20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h6"/></symbol>
</svg>
<div class="app-shell"><header class="site-header"><a class="brand" href="../index.html" aria-label="Payroll ホーム"><span class="brand__icon"><svg class="icon" aria-hidden="true"><use href="#icon-ledger"></use></svg></span><span class="brand__wordmark">Payroll<span class="brand__subname">給与明細管理</span></span></a><div class="header-actions"><button type="button" class="theme-toggle" data-theme-toggle aria-label="ダークモードに切り替える" title="ダークモードに切り替える" aria-pressed="false"><svg class="icon theme-icon--moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.6 8.6 0 1 0 20.2 15.2Z"/></svg><svg class="icon theme-icon--sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><a class="btn btn--secondary" href="../index.html"><svg class="icon" aria-hidden="true"><use href="#icon-arrow"></use></svg>ホームへ戻る</a></div></header>
<main class="vault-page edit-page">
<div class="upload-heading"><div><h1>明細を編集</h1></div></div>
<div id="edit-error" class="vault-alert" role="alert" hidden></div>
<div id="editor" hidden>
<div class="edit-scroll">
<section class="card review-panel saved-editor-panel" aria-label="保存データの編集">
  <div class="selected-file">
    <div class="selected-file__icon"><svg class="icon" aria-hidden="true"><use href="#icon-file"></use></svg></div>
    <div class="selected-file__name-wrap"><strong id="record-name"></strong><span id="record-details"></span></div>
    <div class="selected-file__actions">
      <a id="original-pdf" class="btn btn--soft btn--small" target="_blank" rel="noopener noreferrer"><svg class="icon" aria-hidden="true"><use href="#icon-external"></use></svg>原本を見る</a>
      <a id="download-pdf" class="btn btn--soft btn--small btn--square" title="原本PDFをダウンロード" aria-label="原本PDFをダウンロード"><svg class="icon" aria-hidden="true"><use href="#icon-download"></use></svg></a>
      <button id="edit-delete" type="button" class="btn btn--danger-outline btn--small" title="削除待ちにする（確定まではPDF原本はOneDriveに保持）" aria-label="明細を削除待ちにする"><svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg>削除</button>
      <button class="btn btn--small btn--square" id="record-diagnostic-open" type="button" title="詳細診断" aria-label="詳細診断" disabled><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg></button>
    </div>
  </div>

            <form id="review-form" novalidate>
              <section class="form-section">
                <div class="form-section__heading"><span class="form-section__number">01</span><h3>明細の基本情報</h3></div>
                <div class="form-grid form-grid--two">
                  <label class="field"><span class="field__label">対象年月 <span class="field__required">*</span></span><input class="input" name="targetMonth" type="month" required></label>
                  <label class="field"><span class="field__label">支給日 <span class="field__required">*</span></span><input class="input" name="paymentDate" type="date" required></label>
                  <fieldset class="field field--choice"><legend class="field__label">勤務区分 <span class="field__required">*</span></legend>
                    <div class="segmented-choice" role="group" aria-label="勤務区分">
                      <label><input type="radio" name="job" value="main" required><span>本業</span></label>
                      <label><input type="radio" name="job" value="side" required><span>副業</span></label>
                    </div>
                  </fieldset>
                  <fieldset class="field field--choice"><legend class="field__label">明細種別 <span class="field__required">*</span></legend>
                    <div class="segmented-choice" role="group" aria-label="明細種別">
                      <label><input type="radio" name="kind" value="salary" required><span>給与</span></label>
                      <label><input type="radio" name="kind" value="bonus" required><span>賞与</span></label>
                    </div>
                  </fieldset>
                  <div class="field employer-identity" aria-label="勤務先の選択">
                    <label class="field__label" for="employer-id">勤務先</label>
                    <div class="employer-identity__row">
                      <select class="input" id="employer-id" disabled><option value="">未設定</option></select>
                    </div>
                    <small class="employer-identity__help">勤務先の追加・変更は設定から行えます。</small>
                    <small class="employer-identity__help" id="employer-status" role="status" aria-live="polite"></small>
                  </div>
                  <label class="field" data-salary-only><span class="field__label">出勤日数</span><span class="unit-field"><input class="input" name="workDays" type="number" min="0" step="any" inputmode="decimal" placeholder="未入力"><span>日</span></span></label>
                </div>
              </section>

              <section class="form-section">
                <div class="form-section__heading"><span class="form-section__number">02</span><h3>支給額</h3></div>
                <div class="form-grid form-grid--two">
                  <label class="field"><span class="field__label">総支給額 <span class="field__required">*</span></span><span class="unit-field"><input class="input" name="gross" type="number" min="0" step="1" inputmode="numeric" placeholder="未入力" required><span>円</span></span></label>
                  <label class="field"><span class="field__label">手取り <span class="field__required">*</span></span><span class="unit-field"><input class="input" name="net" type="number" min="0" step="1" inputmode="numeric" placeholder="未入力" required><span>円</span></span></label>
                  <label class="field"><span class="field__label">課税支給額</span><span class="unit-field"><input class="input" name="taxable" type="number" min="0" step="1" inputmode="numeric" placeholder="未入力" ><span>円</span></span></label>
                  <label class="field"><span class="field__label">非課税支給額</span><span class="unit-field"><input class="input" name="nonTaxable" type="number" min="0" step="1" inputmode="numeric" placeholder="未入力"><span>円</span></span></label>
                  <label class="field" data-bonus-only><span class="field__label">賞与額・賞与手当</span><span class="unit-field"><input class="input" name="bonusBase" type="number" min="0" step="1" placeholder="未入力"><span>円</span></span></label>
                  <label class="field" data-bonus-only><span class="field__label">業績手当</span><span class="unit-field"><input class="input" name="performanceBonus" type="number" min="0" step="1" placeholder="未入力"><span>円</span></span></label>
                  <label class="field"><span class="field__label">交通費 <span class="field__optional">支給内訳</span></span><span class="unit-field"><input class="input" name="transportation" type="number" min="0" step="1" inputmode="numeric" placeholder="未入力"><span>円</span></span></label>
                  <label class="field" data-salary-only><span class="field__label">立替経費 <span class="field__optional">通勤手当と併記時のみ</span></span><span class="unit-field"><input class="input" name="reimbursedExpenses" type="number" min="0" step="1" inputmode="numeric" placeholder="未入力"><span>円</span></span></label>
                </div>
              </section>

              <section class="form-section">
                <div class="form-section__heading"><span class="form-section__number">03</span><h3>控除額</h3></div>
                <div class="form-grid form-grid--two">
                  <label class="field"><span class="field__label">所得税</span><span class="unit-field"><input class="input" name="incomeTax" type="number" step="1" placeholder="未入力"><span>円</span></span></label>
                  <label class="field" data-salary-only><span class="field__label">年調過不足税額 <span class="field__optional">年末調整時のみ</span></span><span class="unit-field"><input class="input" name="yearEndAdjustment" type="number" step="1" placeholder="未入力"><span>円</span></span></label>
                  <label class="field"><span class="field__label">住民税</span><span class="unit-field"><input class="input" name="residentTax" type="number" step="1" placeholder="未入力"><span>円</span></span></label>
                  <label class="field"><span class="field__label">健康保険料</span><span class="unit-field"><input class="input" name="healthInsurance" type="number" step="1" placeholder="未入力"><span>円</span></span></label>
                  <label class="field"><span class="field__label">子ども・子育て支援金</span><span class="unit-field"><input class="input" name="childcareSupport" type="number" step="1" placeholder="未入力"><span>円</span></span></label>
                  <label class="field"><span class="field__label">介護保険料</span><span class="unit-field"><input class="input" name="careInsurance" type="number" step="1" placeholder="未入力"><span>円</span></span></label>
                  <label class="field"><span class="field__label">厚生年金保険料</span><span class="unit-field"><input class="input" name="pension" type="number" step="1" placeholder="未入力"><span>円</span></span></label>
                  <label class="field"><span class="field__label">雇用保険料</span><span class="unit-field"><input class="input" name="employmentInsurance" type="number" step="1" placeholder="未入力"><span>円</span></span></label>
                  <label class="field"><span class="field__label">その他控除</span><span class="unit-field"><input class="input" name="otherDeductions" type="number" step="1" placeholder="未入力"><span>円</span></span></label>
                </div>
              </section>
            </form>
<p id="edit-current-review" class="review-current" role="status" aria-live="polite"></p>
<section class="review-confirmation" id="edit-review-confirmation" aria-label="原本との照合確認" hidden>
  <h3>原本との照合が必要です</h3><ul data-review-warnings></ul><dl data-review-rows></dl>
  <label class="review-confirmation__check"><input type="checkbox" id="confirm-diff" disabled>原本と照合し、この内容で保存することを確認しました。</label>
</section>
<details id="edit-review-history" class="review-history" hidden><summary>最後に記録した確認内容</summary><p>過去の確認記録です。現在の検算結果や今回の保存承認とは異なります。</p><p data-review-history-date></p><ul></ul></details>
</section>
</div>
<div class="vault-bottom" data-status-dock><div class="vault-bottom__status"><p id="edit-status" role="status" aria-live="polite"></p></div><div class="edit-save-actions"><button class="btn btn--secondary" id="edit-save-zero" type="button" title="未入力の任意金額を0円にして保存" disabled>未入力を0にして保存</button><button class="btn btn--primary" id="edit-save" type="button">変更を保存</button></div></div>
</div>
</main></div></body></html>
